[package]
name = "rumbok"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Lombok-like derive macros (Getter, Setter, Data) for Rust"
repository = "https://github.com/yamaki-87/rumbok"
readme = "README.md"
keywords = ["derive", "macro", "getter", "setter", "lombok"]
categories = ["development-tools", "rust-patterns"]

[lib]
proc-macro = true

[dependencies]
quote = "1.0.44"
syn = {version="2.0.114",features=["full"]}
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1.0"